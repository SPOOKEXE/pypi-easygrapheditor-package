[project]
name = "easygrapheditor"
version = "0.1.0"
description = "Easily create graph editors using this package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "easygrapheditor" }]
keywords = ["graph", "node-editor", "comfyui", "gradio", "streamlit", "pygame"]
dependencies = [
  "gradio>=6.26.0",
  "numpy>=1.24",
  "pillow>=10.0",
  "pygame>=2.6.1",
  "streamlit>=1.63.0",
]

[project.optional-dependencies]
gradio = ["gradio>=4.0"]
streamlit = ["streamlit>=1.30"]
pygame = ["pygame>=2.5"]
all = ["gradio>=4.0", "streamlit>=1.30", "pygame>=2.5"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/declan/pypi-easygrapheditor-package"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["easygrapheditor/src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
